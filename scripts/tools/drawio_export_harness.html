<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>draw.io export harness</title>
  <style>
    html,
    body,
    iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <iframe id="drawio-frame" src="__BASE_HREF__?embed=1&proto=json&spin=1&configure=1"></iframe>
  <script>
    const frame = document.getElementById("drawio-frame");

    window.addEventListener("message", (event) => {
      if (window.drawioHostPostMessage) {
        window.drawioHostPostMessage(event.data);
      }
    });

    window.__dispatchHostMessage = (payload) => {
      frame.contentWindow.postMessage(payload, "*");
    };
  </script>
</body>
</html>
