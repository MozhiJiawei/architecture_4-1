name: English Only Check

on:
  push:
  pull_request:

jobs:
  english-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run English-only check
        run: python scripts/tools/check_english_only.py
